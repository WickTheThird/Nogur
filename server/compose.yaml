services:
  api:
    build: .
    command: >-
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload
    environment:
      NOGUR_APP_ENV: development
      NOGUR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nogur
      NOGUR_REDIS_URL: redis://redis:6379/0
      NOGUR_JWT_SECRET: local-development-secret-change-before-deployment
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      NOGUR_APP_ENV: development
      NOGUR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nogur
      NOGUR_REDIS_URL: redis://redis:6379/0
      NOGUR_JWT_SECRET: local-development-secret-change-before-deployment
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nogur
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nogur"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
