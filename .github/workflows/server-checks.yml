name: Server checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Validate production image
        run: docker build --tag nogur-server:${{ github.sha }} .

      - name: Validate migration on API startup
        run: |
          docker compose up -d --build api
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            docker compose logs api postgres redis
            exit 1
          fi
          docker compose exec -T api uv run --no-sync alembic current | grep -F "(head)"

      - name: Validate migration no-op on restart
        run: |
          docker compose restart api
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            docker compose logs api
            exit 1
          fi
          docker compose exec -T api uv run --no-sync alembic current | grep -F "(head)"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs api postgres redis
